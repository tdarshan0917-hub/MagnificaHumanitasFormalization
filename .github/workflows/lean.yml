name: Lean and artifact verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build MagnificaHumanitas LocalLaw144Study
      - name: Inspect proof dependencies
        run: lake env lean Audit.lean
      - name: Audit Local Law 144 proof dependencies
        run: lake env lean LocalLaw144Study/Audit.lean
      - name: Check source integrity
        run: python3 scripts/audit_sources.py
      - name: Verify final documents and source identities
        run: |
          python3 -m pip install pypdf==6.10.0
          python3 scripts/verify_release.py
